name: release

# Tag a version and push it to publish a release:
#   git tag v0.4.0 && git push origin v0.4.0
# This cross-compiles the pure-Go binary for all supported platforms and
# uploads version-less assets (juice_<os>_<arch>.tar.gz) plus checksums.txt,
# which is exactly what install.sh downloads from .../releases/latest/download/.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"
          # Pure Go, no cgo: cross-compilation is just GOOS/GOARCH.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "$LDFLAGS" -o dist/juice ./cmd/juice/
            tar -C dist -czf "dist/juice_${os}_${arch}.tar.gz" juice
            rm dist/juice
          done
          ( cd dist && sha256sum juice_*.tar.gz > checksums.txt )
          echo "--- artifacts ---"
          ls -l dist
          cat dist/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/juice_*.tar.gz dist/checksums.txt
